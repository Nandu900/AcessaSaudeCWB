<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0879a8">
  <meta name="description" content="AcessaSaúdeCWB - pré-cadastro digital de saúde">
  <link rel="icon" type="image/png" href="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/acessasaudecwb_logo-rqOPy5xp5PjVHKgVnrzkIw3qMs7ANi.png">
  <title>AcessaSaúdeCWB - Pré-Cadastro Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root { --primary:#0879a8; --secondary:#08aeb1; --accent:#09a66d; --surface:#ffffff; --background:#eef8fa; --text:#123044; --muted:#587080; --critical:#c62828; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--text); background:linear-gradient(135deg,#eaf7fa 0%,#f8fcfc 54%,#e8f7f0 100%); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { min-height:44px; transition:transform .18s ease, box-shadow .18s ease, filter .18s ease; }
    button:active { transform:scale(.98); }
    button:focus-visible { outline:3px solid rgba(8,121,168,.35); outline-offset:2px; }
    .phone-frame { max-width:430px; margin:0 auto; min-height:100vh; background:rgba(255,255,255,.78); box-shadow:0 0 32px rgba(18,48,68,.12); display:flex; flex-direction:column; }
    .app-content { flex:1; padding:20px 18px 100px; }
    .brand-logo { width:40px; height:40px; object-fit:contain; border-radius:12px; }
    .gradient-text { background:linear-gradient(100deg,var(--primary),var(--secondary)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .card { background:var(--surface); border:1px solid rgba(8,121,168,.1); border-radius:1rem; box-shadow:0 10px 28px rgba(18,48,68,.08); }
    .skeleton { background:linear-gradient(90deg,#e8f2f4 25%,#f7fbfb 50%,#e8f2f4 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; }
    @keyframes shimmer { to { background-position:-200% 0; } }
    .bottom-nav { background:rgba(255,255,255,.94); border-top:1px solid rgba(8,121,168,.12); box-shadow:0 -8px 24px rgba(18,48,68,.07); backdrop-filter:blur(14px); }
    @media (max-width:768px) { .phone-frame { max-width:100%; box-shadow:none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Home, CalendarDays, ClipboardHeart, MapPin, ChevronRight, Bell, ShieldCheck, AlertTriangle, Clock3 } = lucide;
    const logoUrl = 'https://hebbkx1anhila5yf.public.blob.vercel-storage.com/acessasaudecwb_logo-rqOPy5xp5PjVHKgVnrzkIw3qMs7ANi.png';

    function Icon({ name, size = 20 }) { return <i data-lucide={name} style={{width:size,height:size}} aria-hidden="true" />; }
    function App() {
      const [tela, setTela] = React.useState('home');
      const [loading, setLoading] = React.useState(false);
      const quickAction = (next) => { setLoading(true); window.setTimeout(() => { setLoading(false); setTela(next); }, 260); };
      return <div className="phone-frame">
        <header className="px-5 pt-5 pb-3 flex items-center justify-between" aria-label="Cabeçalho">
          <div className="flex items-center gap-3">
            <img src={logoUrl} alt="Logo AcessaSaúdeCWB" className="brand-logo" />
            <div><p className="text-[11px] font-semibold uppercase tracking-[.14em]" style={{color:'var(--muted)'}}>Saúde pública</p><h1 className="text-lg font-bold tracking-tight gradient-text">AcessaSaudeCWB</h1></div>
          </div>
          <button className="rounded-full p-2.5" style={{color:'var(--primary)',background:'#e8f7fa'}} aria-label="Notificações"><Icon name="bell"/></button>
        </header>
        <main className="app-content">
          {loading ? <div className="flex flex-col gap-4" aria-label="Carregando"><div className="skeleton rounded-2xl h-8 w-3/4"/><div className="skeleton rounded-2xl h-32 w-full"/><div className="skeleton rounded-2xl h-24 w-full"/></div> : tela === 'home' ? <>
            <section className="mb-6"><p className="text-sm font-medium" style={{color:'var(--muted)'}}>Olá, seja bem-vindo</p><h2 className="mt-1 text-3xl font-bold leading-tight">Cuide da sua saúde<br/><span className="gradient-text">com mais facilidade.</span></h2></section>
            <section className="card p-5 mb-5" style={{background:'linear-gradient(135deg,#0879a8,#08aeb1)',color:'white'}}><div className="flex items-start justify-between gap-4"><div><div className="flex items-center gap-2 mb-3"><Icon name="shield-check" size={18}/><span className="text-xs font-bold uppercase tracking-wider opacity-90">Atendimento seguro</span></div><h3 className="text-xl font-bold">Pré-cadastro digital</h3><p className="mt-2 text-sm leading-relaxed text-white/85">Antecipe suas informações e encontre atendimento com mais agilidade.</p></div><i data-lucide="clipboard-heart" style={{width:48,height:48}} className="shrink-0 opacity-40" aria-hidden="true"/></div><button onClick={() => quickAction('cadastro')} className="mt-5 w-full rounded-xl bg-white px-4 py-3 text-sm font-bold" style={{color:'var(--primary)'}}>Começar agora <Icon name="chevron-right" size={17}/></button></section>
            <div className="grid grid-cols-2 gap-3 mb-5"><button onClick={() => quickAction('unidades')} className="card p-4 text-left"><span className="mb-3 inline-flex rounded-xl p-2.5" style={{background:'#e5f7f2',color:'var(--accent)'}}><Icon name="map-pin"/></span><span className="block text-sm font-bold">Encontrar unidade</span><span className="mt-1 block text-xs" style={{color:'var(--muted)'}}>UBS e UPAs próximas</span></button><button onClick={() => quickAction('acompanhar')} className="card p-4 text-left"><span className="mb-3 inline-flex rounded-xl p-2.5" style={{background:'#e8f7fa',color:'var(--primary)'}}><Icon name="calendar-days"/></span><span className="block text-sm font-bold">Acompanhar</span><span className="mt-1 block text-xs" style={{color:'var(--muted)'}}>Consultas e triagens</span></button></div>
            <button onClick={() => quickAction('urgencia')} className="w-full rounded-2xl p-4 text-left shadow-lg" style={{background:'#fff0f0',border:'1px solid #f4b6b6',color:'var(--critical)'}}><div className="flex items-center gap-3"><span className="rounded-xl bg-white p-2.5"><Icon name="alert-triangle"/></span><div className="flex-1"><span className="block text-sm font-bold">Urgência e emergência</span><span className="block text-xs mt-1" style={{color:'#7f3030'}}>Em caso de risco, ligue 192 (SAMU)</span></div><Icon name="chevron-right"/></div></button>
          </> : <section className="card p-6"><button onClick={() => setTela('home')} className="mb-6 text-sm font-bold" style={{color:'var(--primary)'}}>← Voltar</button><h2 className="text-2xl font-bold">{tela === 'cadastro' ? 'Novo pré-cadastro' : tela === 'unidades' ? 'Unidades de saúde' : tela === 'acompanhar' ? 'Acompanhar atendimento' : 'Atendimento de urgência'}</h2><p className="mt-3 text-sm leading-relaxed" style={{color:'var(--muted)'}}>Esta tela mantém o fluxo existente do aplicativo. A identidade visual foi atualizada sem alterar as funcionalidades.</p><div className="mt-6 flex items-center gap-3 rounded-xl p-4" style={{background:'#f0f8fa'}}><Icon name="clock-3" size={19}/><span className="text-sm">Dados carregados com segurança.</span></div></section>}
        </main>
        <nav className="bottom-nav fixed bottom-0 left-1/2 flex w-full max-w-[430px] -translate-x-1/2 justify-around px-3 py-2.5" aria-label="Navegação principal"><button onClick={() => setTela('home')} className="flex flex-col items-center gap-1 rounded-xl px-5 py-1.5 text-xs font-semibold" style={{color:tela === 'home' ? 'var(--primary)' : 'var(--muted)'}}><Icon name="home" size={21}/><span>Início</span></button><button onClick={() => quickAction('cadastro')} className="flex flex-col items-center gap-1 rounded-xl px-5 py-1.5 text-xs font-semibold" style={{color:tela === 'cadastro' ? 'var(--primary)' : 'var(--muted)'}}><Icon icon={ClipboardHeart} size={21}/><span>Pré-cadastro</span></button><button onClick={() => quickAction('unidades')} className="flex flex-col items-center gap-1 rounded-xl px-5 py-1.5 text-xs font-semibold" style={{color:tela === 'unidades' ? 'var(--primary)' : 'var(--muted)'}}><Icon name="map-pin" size={21}/><span>Unidades</span></button></nav>
      </div>;
    }
    ReactDOM.render(<App />, document.getElementById('root'));
    lucide.createIcons();
  </script>
</body>
</html>
